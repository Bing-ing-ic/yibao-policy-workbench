<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="澄江市乡镇卫生院医保政策决策台：今日研判、政策库、问一问、我的关注。">
<title>医保政策早知道 · 服务于澄江市乡镇卫生院</title>
<script src="./scripts/data-shim.js"></script>
<style>
/* ============ 设计令牌 v2：可读优先，年轻但克制 ============ */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#F1F5FB;
  --ink:#0F1F3D; --ink-2:#33415C; --muted:#5B6B8C;
  --line:#E3E9F3; --line-2:#CBD5E6;
  --brand:#2563EB; --brand-50:#EEF4FF; --brand-hover:#DBE8FE;
  --accent:#0EA5A4; --ai:#7C5CFC;
  --danger:#E11D48; --warn:#F59E0B; --ok:#10B981;
  --shadow:0 2px 8px rgba(16,32,64,.05);
  --shadow-h:0 8px 24px rgba(16,32,64,.10);
  --r:16px; --r-sm:10px; --r-xs:8px;
  --t:.18s cubic-bezier(.2,.8,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
html[data-theme="dark"]{
  --bg:#0B1220; --surface:#151E31; --surface-2:#1C2740;
  --ink:#EAF1FF; --ink-2:#C2CFE8; --muted:#93A2C0;
  --line:#26334E; --line-2:#334261;
  --brand:#6EA8FF; --brand-50:#1B2A4A; --brand-hover:#24375C;
  --accent:#2DD4BF; --ai:#A78BFA; --danger:#FB7185; --warn:#FBBF24; --ok:#34D399;
  --shadow:0 2px 8px rgba(0,0,0,.22); --shadow-h:0 8px 24px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.7 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--brand-hover)}

/* ============ 骨架 ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:20px 15px 12px}
.brand-mark{width:36px;height:36px;flex:0 0 36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--brand),#4F46E5);color:#fff}
.brand-mark svg{width:20px;height:20px}
.brand-txt b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.brand-txt span{display:block;font-size:11px;color:var(--brand);font-weight:700;margin-top:2px;white-space:nowrap}
.nav{flex:1;overflow-y:auto;padding:6px 10px}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;text-align:left;transition:var(--t);margin-bottom:2px}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--brand-50);color:var(--brand);font-weight:700}
.sidebar-foot{padding:12px 15px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7}
.sidebar-foot b{color:var(--ink-2)}

.app-main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:12px;padding:0 22px;
  background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:25}
.topbar h1{font-size:17px;margin:0;font-weight:800}
.crumb{font-size:11px;color:var(--muted);margin-top:1px}
.spacer{flex:1}
.search{position:relative;width:300px;max-width:34vw}
.search input{width:100%;height:40px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--bg);
  padding:0 12px 0 36px;outline:none;font-size:13px;transition:var(--t)}
.search input:focus{border:2px solid var(--brand);background:var(--surface);box-shadow:var(--shadow)}
.search svg{position:absolute;left:12px;top:13px;width:15px;height:15px;color:var(--muted)}
.sug{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);box-shadow:var(--shadow-h);max-height:360px;overflow:auto;z-index:60;display:none;padding:5px}
.sug.on{display:block}
.sug button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:var(--r-xs);font-size:13px}
.sug button:hover{background:var(--surface-2)}
.sug small{display:block;color:var(--muted);font-size:11px}
.iconbtn{width:38px;height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;transition:var(--t);flex:0 0 38px}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}
.iconbtn svg{width:17px;height:17px}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.sync-pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.serve{margin-left:2px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;
  background:linear-gradient(100deg,var(--brand),#4F46E5);white-space:nowrap}

.views{padding:20px 22px 70px;max-width:1440px;width:100%;margin:0 auto}
.view{display:none;animation:rise .26s ease}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 通用 ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sec-head h2{font-size:18px;line-height:1.4;margin:0;font-weight:700}
.sec-head .sub{font-size:12px;color:var(--muted)}
.sec-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-xs);padding:7px 12px;font-size:12px;font-weight:600;transition:var(--t)}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{border:0;color:#fff;background:var(--brand);height:36px;padding:0 16px;font-size:13px;font-weight:700}
.btn.primary:hover{background:#1D4ED8;color:#fff}
.btn.sm{padding:5px 10px;font-size:11px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.6;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.blue{color:var(--brand);background:var(--brand-50);border-color:rgba(37,99,235,.22)}
.chip.cyan{color:var(--accent);background:rgba(14,165,164,.09);border-color:rgba(14,165,164,.22)}
.chip.warn{color:#B45309;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.28)}
.chip.red{color:var(--danger);background:rgba(225,29,72,.09);border-color:rgba(225,29,72,.24)}
.chip.click{cursor:pointer;transition:var(--t)}
.chip.click:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.verdict-badge{padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.verdict-badge.report{background:var(--danger)}
.verdict-badge.selfcheck{background:var(--warn);color:#3B2600}
.verdict-badge.know{background:var(--ok)}
.muted{color:var(--muted)}
.mini{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:6px}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ============ 第1眼：状态结论条（首屏唯一主角） ============ */
.status-conclusion{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);padding:18px 22px 18px 26px;margin-bottom:18px;min-height:96px;
  display:flex;align-items:center;gap:18px}
.status-conclusion::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--warn)}
.status-conclusion.lv-report::before{background:var(--danger)}
.status-conclusion.lv-ok::before{background:var(--ok)}
.status-conclusion .lamp{width:12px;height:12px;border-radius:50%;background:var(--warn);flex:0 0 12px;box-shadow:0 0 0 5px rgba(245,158,11,.14)}
.status-conclusion.lv-report .lamp{background:var(--danger);box-shadow:0 0 0 5px rgba(225,29,72,.14)}
.status-conclusion.lv-ok .lamp{background:var(--ok);box-shadow:0 0 0 5px rgba(16,185,129,.14)}
.status-conclusion .body{flex:1;min-width:0}
.status-conclusion .ttl{font-size:20px;font-weight:800;line-height:1.4;color:var(--ink)}
.status-conclusion .big{font-size:28px;font-weight:800;font-family:var(--font);color:var(--ink);margin-right:6px}
.status-conclusion .desc{font-size:13px;color:var(--ink-2);margin-top:3px}
.status-conclusion .acts{display:flex;gap:9px;align-items:center;flex-shrink:0}

/* ============ 第2眼：决策卡（P0三件套 + P1标签 + P2折叠） ============ */
.decision-card{padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  margin-bottom:12px;position:relative;padding-left:26px;transition:var(--t)}
.decision-card:hover{box-shadow:var(--shadow-h)}
.decision-card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--line-2)}
.decision-card.lv-report::before{background:var(--danger)}
.decision-card.lv-selfcheck::before{background:var(--warn)}
.decision-card.lv-know::before{background:var(--brand)}
.pol-title{font-size:16px;line-height:1.4;font-weight:700;color:var(--ink);margin:0;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.pol-title:hover{color:var(--brand)}
.pol-oneliner{font-size:14px;line-height:1.7;color:var(--ink-2);margin-top:8px;padding-left:10px;border-left:2px solid var(--accent);max-width:68ch}
.pol-oneliner::before{content:"影响 · ";color:var(--accent);font-size:12px;font-weight:700}
.decision-card.is-group .pol-oneliner::before{content:"概览 · "}
.meta-lv-exec{color:var(--brand)!important;font-weight:700!important}
.meta-lv-ref{color:var(--ink-2)!important;font-weight:600!important}
.meta-lv-base{color:var(--muted)!important;font-weight:500!important}
.pol-action{display:block;margin-top:12px;background:var(--brand-50);border-left:3px solid var(--brand);
  border-radius:var(--r-xs);padding:10px 12px;font-size:14px;line-height:1.6;color:var(--ink-2);cursor:pointer;transition:var(--t)}
.pol-action:hover{background:var(--brand-hover)}
.pol-action::after{content:"›";float:right;font-size:17px;color:var(--brand);line-height:1}
.pol-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;align-items:center}
.pol-chip{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.6;border:1px solid transparent}
.pol-chip.lv-report{background:var(--danger);color:#fff}
.pol-chip.lv-selfcheck{background:var(--warn);color:#3B2600}
.pol-chip.lv-exposure{color:var(--danger);background:rgba(225,29,72,.09);border-color:rgba(225,29,72,.24)}
.pol-chip.lv-level{color:var(--brand);background:var(--brand-50);border-color:rgba(37,99,235,.22)}
.pol-chip.lv-plain{color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.pol-meta{font-size:12px;color:var(--muted);margin-left:auto}
.pol-p2{margin-top:10px;font-size:12px;color:var(--muted)}
.pol-p2 summary{cursor:pointer;text-decoration:underline dotted;list-style:none}
.pol-p2 summary::-webkit-details-marker{display:none}
.pol-raw{background:var(--surface-2);border-radius:var(--r-xs);padding:12px;margin-top:9px;font-size:12px;line-height:1.8;color:var(--ink-2)}

/* ============ 第3眼：步骤清单 ============ */
.step-list{margin:0;padding:0;list-style:none}
.step-list li{position:relative;padding-left:28px;font-size:14px;line-height:1.7;margin-bottom:8px;color:var(--ink-2)}
.step-list li::before{content:counter(step);counter-increment:step;position:absolute;left:0;top:2px;width:19px;height:19px;
  border-radius:50%;background:var(--brand-50);color:var(--brand);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step-list{counter-reset:step}

/* ============ 风险堆叠条（替代雷达环） ============ */
.risk-stack{margin-top:10px}
.risk-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.risk-bar i{display:block;height:100%;transition:width .3s ease}
.risk-bar .r{background:var(--danger)} .risk-bar .o{background:var(--warn)} .risk-bar .n{background:var(--line-2)}
.risk-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-2)}
.risk-legend span{display:flex;align-items:center;gap:5px}
.risk-legend i{width:9px;height:9px;border-radius:3px;display:block}
.risk-legend b{font-weight:800}

/* ============ 三级轨道（按可执行性加权） ============ */
.track{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:12px}
.track .name{width:92px;flex:0 0 92px;color:var(--ink-2);font-weight:600}
.track .name small{color:var(--muted);font-weight:400}
.track .bar{flex:1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.track .bar i{display:block;height:100%;background:var(--line-2)}
.track .cnt{font-size:12px;color:var(--muted);width:74px;text-align:right}
.track.exec .bar{height:12px}.track.exec .bar i{background:var(--brand)}
.track.exec .cnt{font-size:14px;font-weight:700;color:var(--brand)}
.track.ref .bar i{background:#94A3B8}
.track.base .bar i{background:#CBD5E6}

/* ============ 筛选 / 表格 ============ */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input,.filters select{height:38px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 11px;font-size:13px;outline:none}
.filters input{min-width:220px;flex:1}
.filters input:focus,.filters select:focus{border-color:var(--brand)}
.seg{display:inline-flex;gap:3px;background:var(--surface-2);border-radius:var(--r-sm);padding:3px}
.seg button{border:0;background:transparent;border-radius:var(--r-xs);padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--brand);font-weight:700;box-shadow:var(--shadow)}
.seg button[data-biz="charge"].on{color:#2563EB;box-shadow:inset 0 0 0 2px #2563EB}
.seg button[data-biz="settle"].on{color:#0EA5A4;box-shadow:inset 0 0 0 2px #0EA5A4}
.seg button[data-biz="risk"].on{color:#B45309;box-shadow:inset 0 0 0 2px #F59E0B}
.seg button[data-biz="report"].on{color:#E11D48;box-shadow:inset 0 0 0 2px #E11D48}
.table-wrap{max-height:66vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2);position:sticky;top:0}
tbody tr:hover{background:var(--surface-2)}
td .t{font-size:14px;font-weight:650;line-height:1.5;cursor:pointer;color:var(--ink)}
td .t:hover{color:var(--brand)}
td .s{font-size:12px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pager{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px 0;font-size:12px;color:var(--muted)}
.pager button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-xs);padding:6px 11px;font-size:12px}
.pager button:disabled{opacity:.4;cursor:default}

/* ============ 问答 ============ */
.chat-shell{display:flex;flex-direction:column;height:min(70vh,680px)}
.chat-body{flex:1;overflow-y:auto;padding:4px}
.msg{display:flex;gap:10px;margin-bottom:14px}
.msg .av{width:30px;height:30px;flex:0 0 30px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800}
.msg.me .av{background:var(--brand)} .msg.ai .av{background:var(--accent)}
.msg .bub{max-width:min(760px,84%);padding:12px 14px;border-radius:13px;font-size:14px;line-height:1.75;white-space:pre-line}
.msg.me .bub{background:var(--brand);color:#fff;border-bottom-left-radius:4px}
.msg.ai .bub{background:var(--surface-2);border-bottom-left-radius:4px}
.msg .cite{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2)}
.suggest{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}
.suggest button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink-2)}
.suggest button:hover{border-color:var(--brand);color:var(--brand)}
.chat-input{display:flex;gap:8px;padding-top:11px;border-top:1px solid var(--line)}
.chat-input input{flex:1;height:42px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 13px;outline:none;font-size:14px}
.chat-input input:focus{border-color:var(--brand)}

/* ============ 弹层 ============ */
.overlay{position:fixed;inset:0;background:rgba(15,31,61,.44);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(880px,100%);max-height:86vh;overflow:hidden;background:var(--surface);border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.24);display:flex;flex-direction:column}
.modal .hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.modal .hd b{font-size:17px;font-weight:800}
.modal .hd .right{margin-left:auto}
.modal .bd{padding:20px;overflow-y:auto}
.modal .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);background:var(--ink);color:var(--surface);
  padding:10px 18px;border-radius:var(--r-xs);font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:var(--t)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ 阅读块 ============ */
.blk{margin-top:12px;padding:12px 14px;border-radius:var(--r-xs);background:var(--surface-2);border:1px solid var(--line)}
.blk .bt{font-size:12px;font-weight:800;color:var(--brand);margin-bottom:5px}
.blk .bd{font-size:14px;line-height:1.75;color:var(--ink-2);white-space:pre-line;max-width:68ch}
.blk.local{background:rgba(14,165,164,.06);border-color:rgba(14,165,164,.2)}
.blk.local .bt{color:var(--accent)}
.blk.warn{background:rgba(225,29,72,.05);border-color:rgba(225,29,72,.18)}
.blk.warn .bt{color:var(--danger)}

.tabbar{display:none}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:var(--t);box-shadow:var(--shadow-h)}
  body.nav-open .sidebar{transform:none}
  .topbar{padding:0 12px;height:58px;flex-basis:58px}
  .search{width:170px}
  .serve{display:none}
  .views{padding:14px 12px 90px}
  .tabbar{display:flex;position:fixed;left:8px;right:8px;bottom:8px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);box-shadow:var(--shadow-h);z-index:40;padding:5px;gap:2px;overflow-x:auto}
  .tabbar button{flex:1;min-width:62px;border:0;background:transparent;border-radius:var(--r-xs);padding:6px 3px;font-size:10px;font-weight:700;color:var(--muted);text-align:center}
  .tabbar button.on{background:var(--brand-50);color:var(--brand)}
  .tabbar svg{width:17px;height:17px;display:block;margin:0 auto 2px}
  .menu-btn{display:flex!important}
  .status-conclusion{flex-wrap:wrap}
  .status-conclusion .acts{width:100%}
}
.menu-btn{display:none}
@media print{.sidebar,.topbar,.tabbar,.filters,.pager,.btn{display:none!important}.view{display:block!important}.card{box-shadow:none}}
</style>

<script>
/* =========================================================
   v2 · 人的问题链：结论 → 决策卡 → 行动 → 原文

   本页只读取，派生字段仅存在内存，不回写数据。

var VIEWS=[
  {id:'home',name:'今日决策台',icon:'home',crumb:'先给结论，再给要做的事'},
  {id:'library',name:'政策库',icon:'book',crumb:'一句话检索，原文按需展开'},

  {id:'ask',name:'问一问',icon:'chat',crumb:'用日常话提问，答案附出处'},
  {id:'watch',name:'我的关注',icon:'star',crumb:'按岗位视角看与自己有关的'}
];
var ICONS={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/>',
  book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22V4.5Z"/><path d="M8 7h8M8 11h6"/>',
  bulb:'<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2Z"/>',
  chat:'<path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/>',
  star:'<path d="m12 2.8 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.4l6.2-.9L12 2.8Z"/>'
};
function icon(n,s){return '<svg viewBox="0 0 24 24" width="'+(s||18)+'" height="'+(s||18)+'" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||ICONS.home)+'</svg>';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function $(s){return document.querySelector(s);}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},2200);}
function fetchJSON(p){return fetch(p,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
function parseContent(v){if(v==null)return{};if(typeof v==='object')return v;try{return JSON.parse(v);}catch(e){return{};}}
function fmtDate(s){return String(s||'').slice(0,10)||'日期待补';}
function levelOrder(l){return l==='玉溪市'?0:(l==='云南省'?1:2);}

var DB={policies:[],kbs:[],state:{},fresh:{},loaded:false};
var UI={view:'home',lib:{kw:'',level:'',biz:'',verdict:'',page:1},ins:{v:'report',kw:'',page:1},
  watch:{biz:'',page:1},compare:[],fav:[],keys:[],chat:[],homeAll:false};
/* freshness.lastRun 兼容 state 中的 lastCheckedAt（同一时刻两种写法） */

/* ============ G9 锚点函数：红线与退出机构 ============ */
function wbIsExit(r){var v=String((r&&r['退出医保标记'])||'').trim();
  return v==='是'||v==='1'||v==='true'||v==='True'||v==='Y'||v==='yes'||v==='退出'||v==='已退出';}
function wbExitList(rows){return (rows||[]).filter(function(r){return wbIsExit(r);});}
function wbMergeExposureIntoStrip(target,rows){
  if(!target)return;
  var ex=(rows||[]).filter(function(r){return String(r['曝光标记']||'')==='是';}).length;
  var out=wbExitList(rows||[]).length;
  target.innerHTML='<div class="risk-stack"><div class="risk-bar">'+
    '<i class="r" style="width:'+(100*ex/(rows.length||1))+'%"></i>'+
    '<i class="o" style="width:'+(100*out/(rows.length||1))+'%"></i>'+
    '<i class="n" style="flex:1"></i></div><div class="risk-legend">'+
    '<span><i style="background:var(--danger)"></i>曝光 <b class="mono">'+ex+'</b></span>'+
    '<span><i style="background:var(--warn)"></i>退出 <b class="mono">'+out+'</b></span>'+
    '<span><i style="background:var(--line-2)"></i>常规 <b class="mono">'+Math.max(0,rows.length-ex-out)+'</b></span></div></div>';
}
function initRadarFix(){
  var box=$('#radarBox'); if(!box) return;
  var ex=DB.policies.filter(function(r){return String(r['曝光标记']||'')==='是';}).length;
  var out=wbExitList(DB.policies).length;
  box.innerHTML='<div class="mini muted">公开通报与协议变动，供对照自查，不代表本院存在问题。</div><div id="radarStrip"></div>';
  wbMergeExposureIntoStrip($('#radarStrip'),DB.policies);
}

/* ============ 数据归一化 + 人话派生（内存计算，不写回） ============ */
function norm(r){
  return {id:r._id||'',title:r['政策标题']||'',date:r['发布日期']||'',org:r['发布机构']||'',
    level:r['行政层级']||'',cat:r['政策类别']||'',impact:r['影响等级']||'',keywords:r['关键词']||'',
    summary:r['政策摘要']||'',url:r['原文链接']||'',ai:r['AI解读']||'',points:r['解读要点']||'',
    actions:r['行动建议']||'',yuxi:r['对玉溪影响']||'',local:r['乡镇卫生院影响']||'',
    status:r['解读状态']||'',change:r['变动类型']||'',checked:r['上次核对']||'',
    exposure:String(r['曝光标记']||'')==='是',exit:wbIsExit(r),
    exitType:r['退出方式']||'',orgType:r['机构类别']||''};
}
/* 清洗：去结构化标记【…】、markdown 星号、文号括注，避免脏字符进人话句 */
function cleanText(v){
  return String(v||'').replace(/【[^】]*】/g,'').replace(/[*_]/g,'')
    .replace(/〔[^〕]*〕\s*\d+号?/g,'').replace(/【/g,'').replace(/】/g,'')
    .replace(/\s+/g,' ').trim();
}
/* 从正文里挑一句真正能指导行动的话：跳过「无/未涉及/无需单独制定」这类空句 */
function pickImpact(v){
  var raw=String(v||'');
  var parts=raw.split(/[\n|；;。]/);
  var best='';
  for(var i=0;i<parts.length;i++){
    var p=cleanText(parts[i]);
    if(p.length<8)continue;
    if(/未涉及|无需单独|不涉及|待补|原文未|无调整|暂无/.test(p))continue;
    if(/建议|须|需要|应|核对|关注|同步|按本地|确认|调整/.test(p)){best=p;break;}
    if(!best)best=p;
  }
  return best;
}
function humanize(r){
  var x=norm(r);
  /* 短标题：摘要首句优先，但跳过「依据…文号」「《…」这类不适合当标题的开头 */
  var s=cleanText(String(r['政策摘要']||'')).split(/[。；;]/)[0].trim();
  if(s.length<6||/^(依据|根据|按照|参照|《|转发|关于印发)/.test(s)){
    s=cleanText(String(r['政策标题']||''));
    s=s.replace(/^[\u4e00-\u9fa5A-Za-z0-9、·\s]{2,50}?关于/,'关于').replace(/^关于/,'');
    s=s.replace(/(的通知|的公告|的通报|的意见)$/,'').replace(/^(印发|转发)/,'');
  }
  /* 书名号内容优先：把《XXX》里的 XXX 提出来当短句，避免「《玉溪…」这种断头标题 */
  var bk=s.match(/《([^》]{4,40})》/);
  if(bk&&bk[1].length>=6) s=bk[1];
  s=s.replace(/^(关于印发|关于|印发|转发|发布|公布)/,'').replace(/^《/,'').replace(/》$/,'');
  /* 截断后清掉尾部悬空括号/连接词，避免出现「…事项清单（」这种断句 */
  var shortTitle=(s.length>18?s.slice(0,18):s)
    .replace(/[（《「【、，,·:：\-\s]+$/,'')
    .replace(/(关于|印发|和|及|的)$/,'')||x.title.slice(0,18);
  var oneLiner=pickImpact(r['乡镇卫生院影响']).slice(0,42);
  if(!oneLiner){ var pat=x.ai.match(/影响对象[：:]([^。；]{4,40})/); oneLiner=pat?cleanText(pat[1]):('涉及'+x.cat+'业务，请按本地口径核对'); }
  if(!/^(我院|结算时|需上报|定点|窗口|按|对|本|相关)/.test(oneLiner)) oneLiner='我院'+oneLiner;
  var act=String(r['行动建议']||'').replace(/\s+/g,' ').trim();
  var actionHint=act.split(/[。；;\n]/)[0].trim().slice(0,26)||'按本地经办口径核对执行';
  var report=x.exposure||x.exit;
  var verdict=report?'report':(x.impact==='高'?'selfcheck':'know');
  var biz=[];
  var hay=[x.title,x.summary,x.points,x.actions,x.local,x.keywords].join(' ');
  if(/收费|诊疗费|价格|收费项目|免收/.test(hay))biz.push('charge');
  if(/结算|报销|支付|起付|比例|拨付/.test(hay))biz.push('settle');
  if(/基金|违规|稽核|检查|监管|自查|通报|曝光/.test(hay))biz.push('risk');
  if(report||/上报|报送|报告医保/.test(hay))biz.push('report');
  return Object.assign(x,{shortTitle:shortTitle,oneLiner:oneLiner,actionHint:actionHint,
    verdict:verdict,biz:biz,rawTitle:x.title});
}
function cardOf(r){return humanize(r);}
function byId(id){for(var i=0;i<DB.policies.length;i++){if(DB.policies[i]._id===id)return DB.policies[i];}return null;}
function chipOf(c){
  var out='<span class="pol-chip lv-'+c.verdict+'">'+(c.verdict==='report'?'上报':(c.verdict==='selfcheck'?'自查':'知晓'))+'</span>';
  if(c.exposure||c.exit)out+='<span class="pol-chip lv-exposure">'+(c.exit?'退出定点':'曝光通报')+'</span>';
  var lvCls=c.level==='玉溪市'?'meta-lv-exec':(c.level==='云南省'?'meta-lv-ref':'meta-lv-base');
  out+='<span class="pol-chip lv-level '+lvCls+'">'+esc(c.level)+'</span>';
  return out+'<span class="pol-meta">'+fmtDate(c.date)+'</span>';
}
/* ============ 导航 ============ */
function renderNav(){
  $('#nav').innerHTML=VIEWS.map(function(v){return '<button type="button" class="nav-item'+(UI.view===v.id?' on':'')+'" data-nav="'+v.id+'">'+icon(v.icon)+'<span>'+esc(v.name)+'</span></button>';}).join('');
  $('#tabbar').innerHTML=VIEWS.map(function(v){return '<button type="button" class="'+(UI.view===v.id?'on':'')+'" data-nav="'+v.id+'">'+icon(v.icon,17)+'<span>'+esc(v.name)+'</span></button>';}).join('');
  $$('[data-nav]').forEach(function(b){b.addEventListener('click',function(){switchView(b.getAttribute('data-nav'));});});
}
function switchView(id){
  UI.view=id;
  $$('.view').forEach(function(v){v.classList.toggle('on',v.id==='view-'+id);});
  var m=VIEWS.filter(function(v){return v.id===id;})[0];
  if(m){$('#viewTitle').textContent=m.name;$('#viewCrumb').textContent=m.crumb;}
  renderNav();document.body.classList.remove('nav-open');window.scrollTo(0,0);
}
function renderAll(){
  renderNav();renderHome();renderLibrary();renderInsight();renderAsk();renderWatch();
  var f=DB.fresh||{};
  $('#syncText').textContent=f.lastRun?('更新于 '+String(f.lastRun).slice(5,16).replace('T',' ')):'已同步';
}

/* ============ 第1/2眼：状态结论条 + 决策卡 ============ */
function todoPool(){
  var now=new Date();
  return DB.policies.filter(function(r){
    var x=humanize(r);
    if(x.exit||x.exposure)return true;
    var dt=new Date(String(r['发布日期']||'').slice(0,10));
    var recent=!isNaN(dt.getTime())&&((now-dt)/86400000)<=90;
    return x.impact==='高'&&(recent||x.level==='玉溪市'||/修订|替代|失效|补充/.test(x.change));
  });
}
function renderHome(){
  var cards=DB.policies.map(humanize);
  var pool=todoPool().map(humanize);
  var ex=cards.filter(function(c){return c.exposure;}).length;
  var out=cards.filter(function(c){return c.exit;}).length;
  var bizHigh=pool.filter(function(c){return !c.exposure&&!c.exit&&c.impact==='高';}).length;
  var hasReport=pool.some(function(c){return c.verdict==='report';});
  var cls=hasReport?'lv-report':(pool.some(function(c){return c.verdict==='selfcheck';})?'lv-warn':'lv-ok');
  var badge=hasReport?'<span class="verdict-badge report">需上报</span>':(pool.length?'<span class="verdict-badge selfcheck">需自查</span>':'<span class="verdict-badge know">暂无需处置</span>');
  $('#conclusion').className='status-conclusion '+cls;
  $('#conclusion').innerHTML='<span class="lamp"></span><div class="body">'+
    '<div class="ttl">'+badge+' 今天有 <span class="mono" style="font-size:22px">'+pool.length+'</span> 条需要你研判</div>'+
    '<div class="desc"><span style="font-weight:700;color:var(--ink-2)">待处理 '+pool.length+' 条</span> · 曝光 '+ex+' · 退出 '+out+' · 业务高影响 '+bizHigh+'　<span class="muted">公开通报与协议变动，供对照自查，不代表本院存在问题</span></div></div>'+
    '<div class="acts"><button class="btn primary" type="button" id="goHandle">开始处理 →</button></div>';
  $('#goHandle').onclick=function(){switchView('library');$('#libVerdict').value='report';UI.lib.verdict='report';UI.lib.page=1;renderLibrary();};

  /* 首屏决策卡：2 组卡 + 3 业务卡（同主题折叠，避免刷屏） */
  var exRows=DB.policies.filter(function(r){return String(r['曝光标记']||'')==='是';}).sort(function(a,b){return String(b['发布日期']||'').localeCompare(String(a['发布日期']||''));});
  var outRows=wbExitList(DB.policies).sort(function(a,b){return String(b['发布日期']||'').localeCompare(String(a['发布日期']||''));});
  var bizRows=pool.filter(function(c){return !c.exposure&&!c.exit;}).sort(function(a,b){
    var va=a.verdict==='selfcheck'?1:0, vb=b.verdict==='selfcheck'?1:0;
    return vb-va||levelOrder(a.level)-levelOrder(b.level)||String(b.date||'').localeCompare(String(a.date||''));
  }).slice(0,UI.homeAll?12:3);
  var html='';
  function groupCard(key,title,desc,hint,rows,tone){

function toggleCompare(id,on){

/* ============ 问一问 ============ */
function tokens(q){var s=String(q||'').toLowerCase().replace(/[，。？！、；：,.?!\s]/g,' ');var out=[];
  s.split(' ').filter(function(x){return x;}).forEach(function(p){out.push(p);if(/[\u4e00-\u9fa5]/.test(p)&&p.length>2){for(var i=0;i<p.length-1;i++)out.push(p.slice(i,i+2));}});
  return out.filter(function(v,i,a){return a.indexOf(v)===i;});}
function ask(q){
  var ts=tokens(q);
  if(!ts.length)return{text:'请先说说想查什么，比如「慢病报销比例」「哪些机构退出了医保」。',refs:[]};
  if(/退出|退医保|定点.*取消|中止协议/.test(q)){
    var list=wbExitList(DB.policies).slice(0,8);
    return{text:'本地台账共 '+wbExitList(DB.policies).length+' 条退出医保机构记录，最近 8 条：\n'+list.map(function(r){return '· '+String(r['政策标题']||'').slice(0,42)+'（'+String(r['退出方式']||'')+' / '+String(r['机构类别']||'')+'）';}).join('\n')+'\n\n点出处可看原文。',refs:list.slice(0,3).map(function(r){return r._id;})};
  }
  if(/上报|医保局/.test(q)){
    return{text:'判断口径：曝光通报或退出定点的条目 → 必须上报；高影响政策 → 需自查；其余仅知晓。可在政策库用「处置」筛选，或在决策解读中查看对应档位。',refs:[]};
  }
  var scored=DB.policies.map(function(r){var c=humanize(r);var hay=[c.title,c.shortTitle,c.summary,c.points,c.keywords,c.cat,c.ai].join(' ').toLowerCase();
    var sc=0;ts.forEach(function(t){if(hay.indexOf(t)>=0)sc+=t.length;});return{c:c,sc:sc};}).filter(function(o){return o.sc>0;}).sort(function(a,b){return b.sc-a.sc;}).slice(0,3);
  if(!scored.length)return{text:'本地 '+DB.policies.length+' 条政策没有直接命中「'+q+'」。试试更短的词，比如「慢病」「长护险」「一般诊疗费」。',refs:[]};
  return{text:'找到 '+scored.length+' 条最相关的：\n\n'+scored.map(function(o,i){return (i+1)+'. '+o.c.shortTitle+'\n   影响：'+o.c.oneLiner+'\n   建议：'+o.c.actionHint;}).join('\n\n'),refs:scored.map(function(o){return o.c.id;})};
}
function renderAsk(){
  $('#chatBody').innerHTML=UI.chat.length?UI.chat.map(function(m){
    var cite=m.refs&&m.refs.length?'<div class="cite">出处：'+m.refs.map(function(id){var r=byId(id);return r?'<button class="btn sm" data-ref="'+esc(id)+'">'+esc(String(r['政策标题']||id).slice(0,22))+'…</button>':'';}).join(' ')+'</div>':'';
    return '<div class="msg '+(m.me?'me':'ai')+'"><div class="av">'+(m.me?'我':'AI')+'</div><div class="bub">'+esc(m.text)+cite+'</div></div>';
  }).join(''):'<div class="msg ai"><div class="av">AI</div><div class="bub">你好。用日常话问我，比如：\n\n· 慢病报销比例是多少？\n· 哪些机构退出了医保？\n· 什么情况要上报医保局？\n\n我会从本地政策里找答案并附出处。</div></div>';
  $$('#chatBody [data-ref]').forEach(function(el){el.onclick=function(){openPolicy(el.getAttribute('data-ref'));};});
  $('#chatBody').scrollTop=$('#chatBody').scrollHeight;

function openCompare(){
  if(UI.compare.length<2){toast('请先勾选 2～3 条政策');return;}
  var rows=UI.compare.map(byId).filter(Boolean);
  var fields=[['一句话','shortTitle'],['人话短句','shortTitle'],['影响说明','oneLiner'],['建议动作','actionHint'],['层级','level'],['发布日期','date'],['处置','verdict'],['原文标题','rawTitle']];
  var html='<div class="table-wrap"><table><thead><tr><th style="width:88px">对比项</th>'+rows.map(function(r){return '<th>'+esc(humanize(r).shortTitle)+'</th>';}).join('')+'</tr></thead><tbody>'+
    fields.filter(function(f,i,a){return a.findIndex(function(x){return x[1]===f[1];})===i;}).map(function(f){return '<tr><th>'+esc(f[0])+'</th>'+rows.map(function(r){return '<td>'+esc(String(humanize(r)[f[1]]||'—'))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
  openModal('政策对比 · '+rows.length+' 条',html,[{label:'关闭',fn:closeModal,primary:true}]);
}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('已复制');},function(){fallback(t);});}else fallback(t);}
function fallback(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败');}document.body.removeChild(a);}
function exportRows(rows,name){
  var cols=['_id','政策标题','发布日期','发布机构','行政层级','影响等级','曝光标记','退出医保标记','退出方式','机构类别','原文链接'];
  var csv='\ufeff'+cols.join(',')+'\n'+rows.map(function(r){return cols.map(function(c){return '"'+String(r[c]||'').replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click();toast('已导出 '+rows.length+' 条');
}

/* ============ 事件绑定 ============ */
$('#themeBtn').onclick=function(){var cur=document.documentElement.getAttribute('data-theme'),next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);lsSet('wb2.theme',next);};
if(lsGet('wb2.theme','')==='dark')document.documentElement.setAttribute('data-theme','dark');
$('#refreshBtn').onclick=function(){boot(true);};
$('#menuBtn').onclick=function(){document.body.classList.toggle('nav-open');};
$('#libKw').oninput=function(){UI.lib.kw=this.value.trim();UI.lib.page=1;renderLibrary();};
$('#libLevel').onchange=function(){UI.lib.level=this.value;UI.lib.page=1;renderLibrary();};
$('#libBiz').onchange=function(){UI.lib.biz=this.value;UI.lib.page=1;renderLibrary();};
$('#libVerdict').onchange=function(){UI.lib.verdict=this.value;UI.lib.page=1;renderLibrary();};
$('#clearLib').onclick=function(){UI.lib={kw:'',level:'',biz:'',verdict:'',page:1};$('#libKw').value='';$('#libLevel').value='';$('#libBiz').value='';$('#libVerdict').value='';renderLibrary();};
$('#compareBtn').onclick=openCompare;
$('#exportLib').onclick=function(){exportRows(filteredLib(),'政策库');};
$$('#insVerdict button').forEach(function(b){b.onclick=function(){UI.ins.v=b.getAttribute('data-v');UI.ins.page=1;$$('#insVerdict button').forEach(function(x){x.classList.toggle('on',x===b);});renderInsight();};});
$('#insKw').oninput=function(){UI.ins.kw=this.value.trim();UI.ins.page=1;renderInsight();};
$('#askSend').onclick=sendAsk;
$('#askInput').onkeydown=function(e){if(e.key==='Enter')sendAsk();};
$('#clearChat').onclick=function(){UI.chat=[];renderAsk();};
$('#askSuggest').innerHTML=['慢病报销比例是多少？','哪些机构退出了医保？','什么情况要上报医保局？'].map(function(q){return '<button type="button">'+esc(q)+'</button>';}).join('');
$$('#askSuggest button').forEach(function(b){b.onclick=function(){$('#askInput').value=b.textContent;sendAsk();};});
$$('#watchBiz button').forEach(function(b){b.onclick=function(){UI.watch.biz=b.getAttribute('data-b');UI.watch.page=1;$$('#watchBiz button').forEach(function(x){x.classList.toggle('on',x===b);});renderWatch();};});
$('#addWatch').onclick=function(){var v=$('#watchKw').value.trim();if(!v)return;
  if(UI.keys.indexOf(v)<0){UI.keys.push(v);lsSet('wb2.keys',UI.keys);toast('已关注：'+v);}$('#watchKw').value='';renderWatch();};
$('#watchKw').onkeydown=function(e){if(e.key==='Enter')$('#addWatch').click();};
$('#globalSearch').oninput=function(){
  var q=this.value.trim(),box=$('#searchSug');if(!q){box.classList.remove('on');return;}
  var ts=tokens(q);
  var hit=DB.policies.map(humanize).filter(function(c){var hay=[c.title,c.shortTitle,c.oneLiner,c.keywords].join(' ').toLowerCase();return ts.some(function(t){return hay.indexOf(t)>=0;});}).slice(0,6);
  box.innerHTML=hit.length?hit.map(function(c){return '<button type="button" data-sug="'+esc(c.id)+'">'+esc(c.shortTitle)+'<small>'+esc(c.level)+' · '+fmtDate(c.date)+'</small></button>';}).join('')+
    '<button type="button" data-sug-ask="1">把「'+esc(q)+'」当作问题提问 →</button>':'<button type="button" data-sug-ask="1">把「'+esc(q)+'」当作问题提问 →</button>';
  box.classList.add('on');
  $$('[data-sug]',box).forEach(function(b){b.onclick=function(){box.classList.remove('on');$('#globalSearch').value='';openPolicy(b.getAttribute('data-sug'));};});
  $$('[data-sug-ask]',box).forEach(function(b){b.onclick=function(){box.classList.remove('on');$('#globalSearch').value='';switchView('ask');$('#askInput').value=q;sendAsk();};});
};
document.addEventListener('click',function(e){if(!e.target.closest('.search'))$('#searchSug').classList.remove('on');});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();$('#searchSug').classList.remove('on');}});

/* ============ 启动 ============ */
function boot(force){
  return Promise.all([fetchJSON('./data/policies.json'),fetchJSON('./data/state.json'),fetchJSON('./data/kb.json')]).then(function(a){
    DB.policies=a[0].rows||[];DB.kbs=a[2].rows||[];
    (a[1].rows||[]).forEach(function(r){DB.state[r['状态键']]=parseContent(r['内容']);});
    DB.fresh=DB.state.freshness||{};
    if(DB.fresh.lastRun===undefined&&DB.fresh.lastCheckedAt!==undefined)DB.fresh.lastRun=DB.fresh.lastCheckedAt;
    if(DB.fresh.nextRun===undefined&&DB.fresh.nextCheckAt!==undefined)DB.fresh.nextRun=DB.fresh.nextCheckAt;
    UI.fav=lsGet('wb2.fav',[]);UI.keys=lsGet('wb2.keys',[]);DB.loaded=true;
    renderAll();if(force)toast('数据已刷新');
  }).catch(function(e){toast('数据装载失败：'+e.message);});
}
boot(false);
</script>
